name: Generate & Deploy Property Feeds

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run feed filter script
        run: python filter_feed.py

      - name: Verify both output files exist and are non-empty
        run: |
          echo "=== custom feed ==="
          wc -l clean_display_feed.csv
          head -2 clean_display_feed.csv
          echo "=== page feed ==="
          wc -l pmax_page_feed.csv
          head -2 pmax_page_feed.csv

      - name: Commit updated feed files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clean_display_feed.csv pmax_page_feed.csv
          git diff --staged --quiet || git commit -m "Auto-update feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
